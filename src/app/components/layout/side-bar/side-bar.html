<aside class="sidebar" [class.collapsed]="isCollapsed()">
  <button 
    class="toggle-btn" 
    (click)="toggleSidebar()"
    [attr.aria-expanded]="!isCollapsed()"
    title="{{ isCollapsed() ? 'Expandir' : 'Colapsar' }} menú"
  >
    <div class="hamburger-icon" [class.open]="!isCollapsed()">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </button>

  <nav class="menu">
    <a 
      routerLink="/products" 
      routerLinkActive="active" 
      class="menu-item"
      [title]="isCollapsed() ? 'Productos' : ''"
    >
      <span class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
      </span>
      @if (!isCollapsed()) {
        <span class="label">Productos</span>
      }
    </a>
    
    <a 
      routerLink="/movements" 
      routerLinkActive="active" 
      class="menu-item"
      [title]="isCollapsed() ? 'Movimientos' : ''"
    >
      <span class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </span>
      @if (!isCollapsed()) {
        <span class="label">Movimientos</span>
      }
    </a>

    <a 
      routerLink="/reports" 
      routerLinkActive="active" 
      class="menu-item"
      [title]="isCollapsed() ? 'Reportes' : ''"
    >
      <span class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14.5 2 14.5 7.5 20 7.5"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
      </span>
      @if (!isCollapsed()) {
        <span class="label">Reportes</span>
      }
      </a>

      <button 
      class="menu-item theme-toggle" 
      (click)="toggleTheme()"
      [title]="isDarkMode() ? 'Modo Claro' : 'Modo Oscuro'"
      >
      <span class="icon">
        @if (isDarkMode()) {
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        }
      </span>
      @if (!isCollapsed()) {
        <span class="label">{{ isDarkMode() ? 'Modo Claro' : 'Modo Oscuro' }}</span>
      }
      </button>
      </nav>
      </aside>
