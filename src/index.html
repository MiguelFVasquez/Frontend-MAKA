<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MAKA</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="makaIcon.png">
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('maka-theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <!-- En index.html (en el <head>) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.2.0/css/all.min.css">
</head>
<body>
  <app-root></app-root>
</body>
</html>
